
# Documentation site configuration.
#
# The layout mirrors morzecrew/forze so the two repositories are navigable by
# the same person: `pages/` holds the config, `docs/` the pages, `_includes/`
# the site-wide snippets that are not themselves pages.
#
# The nav below is a contract, not a convenience: `just docs-check` fails when a
# page is missing from it, and when an entry names a page that does not exist. A
# page absent from the nav is a page nobody finds.

[project]
site_name = "morzer"
site_url = "https://morzecrew.github.io/morzer/"
site_description = "Lifecycle management for a self-hosted product on a single machine"
site_author = "Lev Litvinov"
copyright = "&copy; 2026 Lev Litvinov and contributors"

# ....................... #
# Repo

repo_url = "https://github.com/morzecrew/morzer"
repo_name = "morzecrew/morzer"

# ....................... #
# Navigation
#
# Diátaxis, and by audience. Get started is the tutorial; Operating is the
# operator's task index and Authoring is the bundle vendor's; Reference is what
# either reaches for mid-task; Explanation is why the thing is shaped this way.
#
# The two audiences have their own sections because they are different people
# with different tasks -- an operator wanting to know what `doctor` reports
# should not have to scroll past a dependency-inversion argument.

nav = [
    { "Home" = "index.md" },
    { "Get started" = [
        "get-started/installation.md",
        "get-started/first-deployment.md",
    ] },
    { "Operating" = [
        "operating/updating.md",
        "operating/rolling-back.md",
        "operating/secrets.md",
        "operating/backups.md",
        "operating/installing-offline.md",
        "operating/recovering-a-lost-machine.md",
    ] },
    { "Authoring" = [
        "authoring/index.md",
        "authoring/your-first-bundle.md",
        "authoring/hooks.md",
        "authoring/publishing.md",
    ] },
    { "Reference" = [
        "reference/commands.md",
        "reference/secret-commands.md",
        "reference/release-commands.md",
        "reference/installation-commands.md",
        "reference/exit-codes.md",
        "reference/output-modes.md",
        "reference/manifest.md",
        "reference/hooks.md",
    ] },
    { "Explanation" = [
        "explanation/architecture.md",
        "explanation/the-step-engine.md",
        "explanation/secrets.md",
    ] },
]

# ....................... #
# Development

dev_addr = "localhost:8046"

# ....................... #
# Theme

[project.theme]
features = [
    "search.highlight",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.sections",
    "navigation.path",
    "navigation.top",
    "toc.follow",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
    "content.tooltips",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "blue grey"
accent = "amber"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
primary = "blue grey"
accent = "amber"

# ....................... #
# Extensions

[project.markdown_extensions.pymdownx.snippets]
# `..` is the repository root: a page may include a file from `testdata/`
# directly, so a documented example cannot drift from one the test suite runs.
base_path = ["docs", "..", "."]
check_paths = true
# Site-wide abbreviations, defined once outside the docs tree so the file is not
# built as a page, and rendered as <abbr> tooltips everywhere.
auto_append = ["_includes/abbreviations.md"]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
# Diagrams are mermaid in fenced blocks, rendered by the theme.
#
# The design called for d2 sources rendered to SVG at build time, ported from
# forze. Mermaid needs no binary in CI, no build step before every deploy, and
# no gitignored SVGs kept in step with their sources -- and the theme already
# themes it for light and dark. The trade is that it renders client-side, so a
# reader with no network sees the source text rather than a picture.
[project.markdown_extensions.pymdownx.superfences]

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# ....................... #
# Versioning
#
# The manifest schema, the state schema and the manager itself are each
# versioned, and the manager's whole job is careful version transitions. A
# single always-latest site could not tell an operator running an older binary
# what their version does.
#
# `main` publishes `dev`; a tag publishes `<minor>` and moves `latest`. `dev` is
# never the default and never carries an alias. See .github/workflows/docs-*.

[project.extra.version]
provider = "mike"
default = "latest"
alias = true
