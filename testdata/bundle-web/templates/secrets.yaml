# Per-tier credentials. `services` is what the manager restarts when a secret
# is rotated, so it names the tiers that actually hold each one -- the frontend
# appears nowhere, because it holds nothing.
api_version: selfhost/v1alpha1

secrets:
  - name: db_password
    description: Database password used by the backend
    required: true
    generator:
      kind: password
      length: 32
    services: [backend, db]
    rotation_period: 2160h

  - name: session_key
    description: Key the backend signs session cookies with
    required: true
    generator:
      kind: hex
      length: 64
    services: [backend]
