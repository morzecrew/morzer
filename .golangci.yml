version: "2"

# The linter configuration is part of the architecture, not decoration.
#
# depguard is the reason this file matters: it enforces the layering rules
# mechanically rather than by discipline. Without it, "the lifecycle layer
# speaks only to ports" is a sentence in a document that the next refactor
# quietly violates.

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - contextcheck
    - depguard
    - misspell
    - unconvert
    - nakedret
    - revive

  settings:
    depguard:
      rules:
        # The domain layer is pure: stdlib and semver, nothing else. A YAML
        # decoder or an HTTP client in here would mean the rules the whole
        # system rests on could not be unit-tested in isolation.
        domain:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - github.com/Masterminds/semver/v3
          deny:
            - pkg: github.com/morzecrew/morzer/internal
              desc: >-
                domain imports nothing from this repository. It is the layer
                every other layer depends on, so a dependency here would make
                the graph cyclic in spirit if not in fact.

        # The lifecycle layer composes ports. It must not know that Docker
        # exists. Adapters are named in exactly one place: internal/cli.
        lifecycle:
          files:
            - "**/internal/lifecycle/**"
          # No allow list. An allow list here has to enumerate every package
          # the layer legitimately uses -- domain, ports, events, infra -- and
          # would then need editing every time one is added, which is how a
          # layering rule ends up disabled rather than maintained. The rule
          # expresses the single prohibition that matters.
          deny:
            - pkg: github.com/morzecrew/morzer/internal/adapters
              desc: >-
                the lifecycle layer speaks only to ports. Reaching for an
                adapter here is the boundary being wrong -- add a port method,
                or an optional capability interface.

        # The terminal libraries are confined to internal/ui. Bubble Tea owns
        # a terminal: it puts it in raw mode, reads keys and drives a render
        # loop. Once any other package can construct a program, "the UI is a
        # subscriber, never a participant" stops being a structural fact and
        # becomes a convention -- and the first thing to go is a command that
        # renders directly instead of publishing an event, which then has no
        # plain, JSON or log equivalent.
        #
        # internal/cli drives the live view through tty.Run, which takes the
        # bus and a closure. That is the whole surface.
        terminal:
          files:
            - "**/internal/**"
            - "!**/internal/ui/**"
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: >-
                the terminal program lives in internal/ui/tty. Drive it with
                tty.Run, or publish an event and let the presenters render it.
            - pkg: github.com/charmbracelet/bubbles
              desc: terminal widgets belong to internal/ui.
            - pkg: github.com/charmbracelet/lipgloss
              desc: >-
                styling belongs to internal/ui/theme, which is also what makes
                --no-color and the ASCII fallback work everywhere at once.

        # Colour has roles, and a view may not invent one. The theme defines
        # exactly the set that is needed -- OK, Fail, Warn, Active, Dim, Bold,
        # Detail, Added, Removed, Highlight -- and a view calls one of those or
        # none. Reaching for lipgloss inside internal/ui is how a sixteenth
        # colour arrives that NO_COLOR does not switch off and no symbol
        # accompanies, which is the accessibility half of RFC 0019 §5.6 rotting
        # in one commit.
        #
        # internal/ui/tty is exempt: it builds the live Bubble Tea program and
        # its plan table, which are lipgloss layouts rather than colour choices.
        views:
          files:
            - "**/internal/ui/**"
            - "!**/internal/ui/theme/**"
            - "!**/internal/ui/tty/**"
          deny:
            - pkg: github.com/charmbracelet/lipgloss
              desc: >-
                a view calls a theme role or none. The roles are in
                internal/ui/theme, they carry a symbol as well as a colour, and
                they are what --no-color switches off in one place.

        # Ports declare interfaces. An implementation detail leaking in here
        # would make every adapter depend on whichever tool got there first.
        ports:
          files:
            - "**/internal/ports/**"
          allow:
            - $gostd
            - github.com/morzecrew/morzer/internal/domain
            - github.com/morzecrew/morzer/internal/events
          deny:
            - pkg: github.com/morzecrew/morzer/internal/adapters
              desc: interfaces are declared by the consumer, never by the implementation.
            - pkg: github.com/morzecrew/morzer/internal/lifecycle
              desc: >-
                ports sit below lifecycle. An import here would point a
                dependency arrow upward.

    errcheck:
      # Deliberate discards are written as `_ =` and are always accompanied by
      # a comment saying why the error cannot matter.
      check-type-assertions: true
      check-blank: false
      # Writes to an output stream. Every one in this codebase goes to stdout
      # or stderr for an operator to read; there is nothing useful to do when
      # one fails, and an operation must never fail because its narration could
      # not be printed. Files are written through internal/infra/atomicfs,
      # which does check.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    gosec:
      excludes:
        # Reading a file whose path came from configuration is what this
        # program does. G304 fires on essentially every read, and where
        # containment actually matters it is enforced by os.Root, which the
        # linter cannot see.
        - G304
        # File permissions are a first-class concern here and are asserted by
        # the contract suite. The linter cannot see that 0400 and 0700 are
        # chosen deliberately, and flags every constant.
        - G302
        - G306
        # Subprocess execution with variable arguments is the entire point of
        # internal/infra/exec. It is confined to one reviewed package.
        - G204

    revive:
      rules:
        - name: exported
          disabled: true # doc comments are enforced by review, not by count
        - name: package-comments

    staticcheck:
      checks:
        - all

  exclusions:
    rules:
      # Test files construct adapters directly on purpose: that is what the
      # contract suites are for.
      - path: _test\.go
        linters:
          - depguard
          - gosec
      # The shared contract suites live in non-_test files so several packages
      # can run them. They build paths from their own fixtures and deliberately
      # corrupt bundles, which is the work, not a finding.
      - path: test/
        linters:
          - depguard
          - gosec

      # cobra propagates the context through cmd.Context(), which
      # ExecuteContext sets from the signal-aware context in main. contextcheck
      # does not model that accessor and asks for a ctx parameter on every
      # command constructor -- which, once added, it then demands be threaded
      # through each subcommand closure. The linter stays on everywhere else,
      # where it caught a real background-context leak in the log sink.
      - path: internal/cli/
        linters:
          - contextcheck

      # tools/ are build-time helpers, run by `just` and by CI on paths given
      # on their own command line. G703 fires on every one of those reads and
      # writes; there is no untrusted input and nothing to contain. They are
      # also excluded from -coverpkg, so they never ship.
      - path: tools/
        linters:
          - gosec

      # internal/infra/atomicfs exists to perform filesystem operations on
      # caller-supplied paths, so G304 ("file inclusion via variable") fires on
      # every function in it. Containment is enforced by os.Root, which the
      # linter cannot see, and is asserted by the path-traversal tests.
      - path: internal/infra/atomicfs/
        linters:
          - gosec
        text: "G304"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/morzecrew/morzer
