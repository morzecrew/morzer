# Release builds.
#
# The build flags here must match the justfile's, because reproducibility is the
# claim: a binary an operator builds from a tag should be byte-identical to the
# one this publishes. `-trimpath` removes the build machine's paths,
# `CGO_ENABLED=0` makes a static binary with no libc dependency, and the version
# stamps are the only inputs that vary.
#
# Archives are `tar.zst`, which is also the release-bundle format — one
# decompressor for both, and the one this program already links.
version: 2

project_name: morzer

before:
  hooks:
    # A release that fails `go mod tidy` afterwards is a release whose module
    # graph nobody can reproduce.
    - go mod verify

builds:
  - id: morzer
    main: ./cmd/morzer
    binary: morzer
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # The commit's timestamp rather than the build's, so two builds of one tag
    # produce identical bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: morzer
    formats: [tar.zst]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The manifest schemas ship with the release so a bundle vendor can
      # validate against the exact version of the manager they target.
      - schemas/*

checksum:
  name_template: SHA256SUMS

# Signing is what makes the checksums worth anything: without it, whoever can
# replace a binary can replace the sums file beside it.
#
# The key is a repository secret and never leaves CI. There is deliberately no
# `morzer sign` — see RFC 0004 decision 8 — and this is the other half of that
# decision: signing happens in the release pipeline, where the key lives.
signs:
  - id: minisign
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
      - -t
      - "morzer {{ .Version }}"
    signature: "${artifact}.minisig"
    # The checksums file, not each binary: signing one file that covers them
    # all is the same chain a release bundle uses, and is what
    # `minisign -Vm SHA256SUMS` checks.
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Assembled from conventional commits, which the repository already enforces
  # by convention. The gitmoji prefix is stripped by the group patterns.
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?(✨|feat)(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?(🐛|🚑|fix)(\(.+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?(🔒|🛡)(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^.*?(📝|docs)(\(.+\))??!?:'
      - '^.*?(✅|test)(\(.+\))??!?:'
      - '^.*?(👷|ci)(\(.+\))??!?:'
      - "^Merge "

release:
  draft: true
  # A release an operator installs is a release a human looked at first. The
  # draft is published by hand after checking the notes.
  prerelease: auto
  footer: |
    ## Verifying this release

    ```sh
    ARCHIVE=morzer_{{ .Version }}_linux_amd64.tar.zst   # the one you downloaded

    curl -fsSLO https://raw.githubusercontent.com/morzecrew/morzer/main/morzer.pub
    minisign -Vm SHA256SUMS -p morzer.pub
    grep " ${ARCHIVE}$" SHA256SUMS | sha256sum -c -
    ```

    `SHA256SUMS` covers every architecture, so checking it whole fails on the
    archives you did not download — and `--ignore-missing`, the usual way
    around that, reports `OK` when *no* archive is present at all. Pulling out
    the line for the file you have fails when there is nothing to check.

    The signing key is the same for every release. If you have verified a
    morzer release before, use the copy you already have rather than fetching
    it again — a key that changes between releases is the thing worth noticing.

    Release bundles are a separate artifact with their own signature and their
    own key; see
    https://morzecrew.github.io/morzer/reference/release-commands/#verification
