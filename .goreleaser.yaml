# Release builds.
#
# The build flags here must match the justfile's, because reproducibility is the
# claim: a binary an operator builds from a tag should be byte-identical to the
# one this publishes. `-trimpath` removes the build machine's paths,
# `CGO_ENABLED=0` makes a static binary with no libc dependency, and the version
# stamps are the only inputs that vary.
#
# Archives are `tar.zst`, which is also the release-bundle format — one
# decompressor for both, and the one this program already links.
version: 2

project_name: morzer

before:
  hooks:
    # A release that fails `go mod tidy` afterwards is a release whose module
    # graph nobody can reproduce.
    - go mod verify

builds:
  - id: morzer
    main: ./cmd/morzer
    binary: morzer
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # The commit's timestamp rather than the build's, so two builds of one tag
    # produce identical bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: morzer
    formats: [tar.zst]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # The manifest schemas ship with the release so a bundle vendor can
      # validate against the exact version of the manager they target.
      - schemas/*

checksum:
  name_template: SHA256SUMS
  # The installer is covered by the same file it teaches an operator to check,
  # which closes the "who verifies the verifier" loop: somebody who has the
  # release can verify the script that installs it against the signed sums.
  extra_files:
    - glob: install.sh

# Signing is what makes the checksums worth anything: without it, whoever can
# replace a binary can replace the sums file beside it.
#
# The key is a repository secret and never leaves CI. There is deliberately no
# `morzer sign` — see RFC 0004 decision 8 — and this is the other half of that
# decision: signing happens in the release pipeline, where the key lives.
signs:
  - id: minisign
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
      - -t
      - "morzer {{ .Version }}"
    signature: "${artifact}.minisig"
    # The checksums file, not each binary: signing one file that covers them
    # all is the same chain a release bundle uses, and is what
    # `minisign -Vm SHA256SUMS` checks.
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # The release body comes from CHANGELOG.md, built by
  # `.github/scripts/release-notes.sh` and passed as `--release-notes`.
  #
  # **There is deliberately no `disable: true` here, and that is not an
  # oversight.** It was here, and it is what published v0.3.0 with an empty
  # body. `disable` skips the whole changelog pipe -- and that pipe is the only
  # thing that reads `--release-notes`. GoReleaser v2.17.1,
  # `internal/pipe/changelog/changelog.go`: `Skip()` returns
  # `Changelog.Disable`, `Run()` is the sole caller of `loadContent(...
  # ReleaseNotesFile ...)` and the sole assignment to `ctx.ReleaseNotes`. Skip
  # the pipe and the file is never opened, so the body is empty and nothing
  # errors -- the notes had already been built, printed into the job log, and
  # handed to a flag nobody would read.
  #
  # Leaving it unset does **not** bring back the commit-log body. Run() loads
  # the file, assigns it, and returns before reaching the commit walk: a
  # `--release-notes` run generates nothing from git. That early return is the
  # guarantee `disable` was reached for, and it was already there.
  #
  # A commit log is still the wrong source, which is why the flag exists at
  # all. `use: github` with group patterns and exclude filters produced the two
  # releases that argue against it: v0.1.0 had no previous tag to diff against
  # and listed every commit in the repository, `fix(backup): improve volume
  # reporting` and agent-skill commits included; v0.1.1 listed a single subject
  # and a SHA. No filter fixes that -- a commit subject is addressed to whoever
  # reads `git log`, and release notes are addressed to whoever is deciding
  # whether to upgrade.
  #
  # `--release-notes` also replaces the body outright, so `release.header` and
  # `release.footer` never run once it is passed. The footer moved into the
  # script for that reason; leaving it here would be config that reads as live.

release:
  draft: true
  # Carried as an asset so a machine that has the release tarball can bootstrap
  # without reaching the site, and so the script that installed a version is
  # archived beside it. The canonical copy is at the site root; both are the
  # same bytes, which the nightly job checks rather than assumes.
  extra_files:
    - glob: install.sh
  # A release an operator installs is a release a human looked at first. The
  # draft is published by hand after checking the notes.
  prerelease: auto
