name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, please report it privately instead —
        see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what it did.
      placeholder: |
        $ morzer update ./bundle
        ...
    validations: {required: true}

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `morzer version`.
    validations: {required: true}

  - type: textarea
    id: doctor
    attributes:
      label: morzer doctor
      description: >
        Output of `morzer doctor --json`, if the installation is reachable. It
        is designed to answer most of what would otherwise be a follow-up
        question. Check it for anything you would rather not share.
      render: json

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, `docker version`, whether it runs under systemd.
