# Continuous integration.
#
# Every gate is a `just` recipe. CI does not restate commands, so a contributor
# who runs `just check && just lint && just contract-strict` locally has run
# what CI runs, and a failure here is reproducible there.
#
# Third-party actions are pinned by commit SHA rather than tag. A moving tag is
# arbitrary code execution with whatever permissions the job holds; Dependabot
# updates the SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Callable from release.yaml, so a tag is verified at release time rather
  # than trusting that CI happened to pass on the commit earlier.
  workflow_call:
    inputs:
      force_full:
        description: Run every job regardless of which paths changed.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every job regardless of which paths changed.
        type: boolean
        default: true

# Read-only by default. Jobs elevate individually if they ever need to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to main are not, so the
  # history of what passed on main stays complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned deliberately. An unpinned linter turns an unrelated upstream release
  # into a red build on an untouched branch.
  GOLANGCI_LINT_VERSION: "2.12.2"
  ACTIONLINT_VERSION: "1.7.12"
  SOPS_VERSION: "3.13.3"
  # Pinned like the rest, and for the reason above rather than for tidiness:
  # the runner image ships its own shellcheck, and using it made a branch that
  # touched no shell script fail on an informational finding in a file it did
  # not edit. A linter nobody chose is a linter that changes under you.
  SHELLCHECK_VERSION: "0.11.0"
  # There is no checksums file in shellcheck's releases, so the digest of the
  # asset itself is pinned here. Bumping the version means bumping this too,
  # which is the point: both are a reviewable change in this file.
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'justfile'
              - '.golangci.yml'
              - 'testdata/**'
              # The installer is shipped code with its own test suite, and
              # neither lives under a Go path -- without this, the two
              # edits that change what it does trigger nothing.
              - 'install.sh'
              # The scripts the gates below execute, and the workflow that
              # defines them. `acceptance.sh` *is* the acceptance scenario and
              # this file decides when it runs, yet neither matched a filter
              # that runs it -- so the two edits guaranteed to affect that job
              # were the two edits that could not trigger it. `workflows/**`
              # rather than the whole of `.github`, so a dependabot config or
              # an issue template does not drag the container suites in.
              - '.github/scripts/**'
              - '.github/workflows/**'
            docs:
              - 'pages/**'
              - 'README.md'
            workflows:
              - '.github/**'

      - id: decide
        # A push to main and an explicitly requested run ignore the path
        # filters. Anything merged to main gets the full suite regardless of
        # what it touched.
        run: |
          if [ "${{ inputs.force_full }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.run_full == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o actionlint.tar.gz \
            "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt \
            "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          expected=$(grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz\$" checksums.txt | awk '{print $1}')
          echo "${expected}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - run: actionlint -color

  quality:
    name: Formatting, vet and lint
    needs: changes
    if: needs.changes.outputs.run_full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          v="${GOLANGCI_LINT_VERSION}"
          base="https://github.com/golangci/golangci-lint/releases/download/v${v}"
          curl -fsSL -o golangci-lint.tar.gz "${base}/golangci-lint-${v}-linux-amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/golangci-lint-${v}-checksums.txt"
          expected=$(grep "golangci-lint-${v}-linux-amd64.tar.gz\$" checksums.txt | awk '{print $1}')
          echo "${expected}  golangci-lint.tar.gz" | sha256sum -c -
          tar -xzf golangci-lint.tar.gz "golangci-lint-${v}-linux-amd64/golangci-lint"
          sudo install -m 0755 "golangci-lint-${v}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint

      # Ordered cheapest-first: a formatting violation should fail in seconds
      # rather than after the linter has walked the whole module.
      - run: just fmt-check
      - run: just vet
      - run: just lint

      # depguard, which `just lint` runs, enforces the layering as imports.
      # This is the half it cannot see: a name above internal/adapters that
      # says which runtime is running, or a branch on one. Needs only Go, so
      # it sits beside the linter rather than in a job of its own.
      - run: just runtime-check

      - name: Install shellcheck
        run: |
          set -euo pipefail
          v="${SHELLCHECK_VERSION}"
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${v}/shellcheck-v${v}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz "shellcheck-v${v}/shellcheck"
          sudo install -m 0755 "shellcheck-v${v}/shellcheck" /usr/local/bin/shellcheck

      # install.sh is checked with `sh` as the dialect, so a bashism fails
      # here rather than on the freshly provisioned box the script exists for.
      - run: just shellcheck

  test:
    name: Test (go ${{ matrix.go }})
    needs: [changes, quality]
    if: needs.changes.outputs.run_full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The declared floor in go.mod, and whatever is current. Testing only
        # the latest toolchain silently raises the floor for everyone else.
        go: ["1.25.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Without sops the real SecretStore contract suite skips itself and the
      # run stays green having exercised only the fake. Installing it is what
      # makes the next step meaningful.
      - name: Install sops
        run: .github/scripts/install-sops.sh "$SOPS_VERSION"

      # Asserts no contract suite skipped. This is the guard against CI being
      # greener than the code: the install above could silently stop working
      # and nothing else would report it.
      - run: just contract-strict

      - run: just test-race

  docs:
    name: Docs drift and site build
    needs: changes
    # Gated on `code` as well as `docs`: the checker reads the command tree,
    # the manifest schema and the hook ABI out of the source, so a change that
    # touches no page at all is exactly the change that breaks it.
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9

      # Drift first: it needs only Go, and it is the check that fails on a code
      # change nobody documented.
      - run: just docs-check

      # A broken nav or an unparseable config must not be discovered at deploy
      # time, when the only signal is a red badge on main.
      - run: just build-docs

  acceptance:
    name: Acceptance (real Docker)
    needs: [changes, test]
    # On a pull request that touches code, as well as on what merges and what
    # ships. It was previously the latter only -- `run_full` is set for a push
    # and never for a pull request -- and "does this actually work on a
    # machine" answered after the merge is answered too late: this job stayed
    # red across three consecutive merges to main before anyone had a signal
    # that could have blocked one.
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Optional, and deliberately so. Anonymous pulls from Docker Hub are
    # limited per IP and Actions runners share theirs, so this job's pinned
    # images compete with every other project on the same runner -- and it now
    # runs per pull request rather than per merge, which multiplies the rate.
    # A token moves the pulls onto a per-account budget.
    #
    # Absent, they stay anonymous and everything still runs. That is not a
    # tidiness fallback: secrets are not available to a pull request from a
    # fork, so anonymous is the contributor path, and a login that was required
    # would lock out exactly the people this is meant to serve.
    env:
      # Whether a token exists, never the token. A step's `if` cannot read the
      # secrets context, so the *answer* has to be a job-level value -- but the
      # credentials themselves stay bound to the one step that needs them,
      # rather than sitting in the environment of every step after it. `just
      # acceptance-cover` runs this repository's own scripts and tests, and a
      # same-repository pull request can change those.
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Before anything pulls. The guard is the token's presence rather than
      # the event, so a fork's run skips it and says nothing; --password-stdin
      # keeps the token out of the process table.
      #
      # `docker login` still leaves the credential in the runner's Docker
      # config for the rest of the job, which is unavoidable while later steps
      # have to pull with it. What bounds that is the token's scope: it needs
      # `Public Repo Read-only` and nothing more, so the worst a leaked one
      # buys is the right to pull public images against this account's limit.
      - name: Log in to Docker Hub when a token is configured
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The scenario encrypts real secrets, so it needs the real store.
      - name: Install sops
        run: .github/scripts/install-sops.sh "$SOPS_VERSION"

      # Docker and jq are already on ubuntu-latest; asserted rather than
      # assumed, because a runner image change would otherwise surface as a
      # confusing failure halfway through the scenario.
      - name: Check the runner has what the scenario needs
        run: |
          set -euo pipefail
          docker version
          docker compose version
          jq --version

      # Instrumented, so what the scenario exercises -- Compose, systemd, the
      # health probes, the CLI wiring -- reaches the coverage gate. It is the
      # same code with counters added; `just acceptance` stays uninstrumented
      # for local runs, so the shape that ships is still exercised by hand.
      - run: just acceptance-cover

      # Only when the scenario passed, because the profile is written after it
      # and cannot exist otherwise. With `always()` a failed scenario reported
      # twice -- once for the real failure, then again for the missing file --
      # and the second error is the one that showed up first in the summary.
      # The coverage job already treats an absent profile as a reason to fall
      # back to the unit floor, so nothing downstream needs the empty upload.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: acceptance-profile
          path: acceptance.profile
          if-no-files-found: error
          retention-days: 7

  containers:
    name: Container suites (real services)
    needs: [changes, test]
    # The suites behind the `docker` build tag start Compose projects, Caddy,
    # Redis, Postgres and a registry. They answer what a fake cannot -- whether
    # what comes back is what the adapter thinks it is -- so they run wherever
    # the acceptance scenario does, on the same "does this work on a machine"
    # grounds -- including, now, on a pull request that touches code.
    if: >-
      needs.changes.outputs.run_full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Seven pinned images, which is the heaviest pull load in this workflow.
    # Optional for the same reason as the acceptance job above: a fork's pull
    # request has no secrets, and must still be able to run this. Scoped to the
    # step for the same reason too -- `just test-docker-cover` runs this
    # repository's own tests.
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker Hub when a token is configured
        if: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Once the tag is set, a missing daemon is a failure rather than a skip:
      # a run that exercised nothing has to say so.
      - name: Check the runner has a daemon
        run: docker version

      - run: just test-docker-cover

      # Only when the suites passed, for the same reason as the acceptance
      # profile -- though this one fails differently, and worse. `go test`
      # writes its -coverprofile whatever the outcome: a failed run still
      # leaves a partial docker.out, and a run that did not compile leaves a
      # 10-byte "mode: set". Uploading either does not produce a missing-file
      # error, it produces a *present* profile that understates coverage --
      # and the job below decides which floor applies by whether the file
      # arrived. A failed container run would therefore be held to the union
      # floor on a union that is missing most of its statements, and the
      # second red job would say "coverage" while the real failure was here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: container-profile
          path: docker.out
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage floor
    # Acceptance and the container suites are in `needs` for their profiles,
    # not for their verdicts: the condition below runs this job whether they
    # ran, were skipped, or failed, and the floor adjusts to whichever
    # profiles arrived. Without them in `needs` this job would start first and
    # find no artefacts at all.
    needs: [changes, test, acceptance, containers]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      (needs.changes.outputs.run_full == 'true' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Two floors, because two things can arrive.
      #
      # UNIT_FLOOR measures `go test` alone. A pull request touching code now
      # runs the container and acceptance jobs too, so it is normally held to
      # the union floor -- the same one main is held to, which is the point.
      # This is what remains for the runs that produce nothing else: a job
      # that failed, or was skipped because the change touched no code.
      # UNION_FLOOR adds their profiles: the container suites drive the
      # adapters against real services, and the acceptance run drives the
      # built binary, which is where the CLI wiring and systemd get exercised.
      # Measured on one tree: 84.6% for `go test`, 66.4% for the container
      # suites, 47.2% for acceptance, and 86.1% together.
      #
      # Floors, not targets. Raised deliberately; lowering either is a
      # reviewable change in this file rather than a silent drift.
      UNIT_FLOOR: "84"
      UNION_FLOOR: "86"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Without sops the secret-store adapter's statements drop out of the
      # total, and the floor would be measuring a smaller program than ships.
      - name: Install sops
        run: .github/scripts/install-sops.sh "$SOPS_VERSION"

      - name: Measure `go test` coverage
        run: just test-cover

      # Present only when the acceptance job ran. `continue-on-error` rather
      # than a condition on the job's result, so a skipped, failed or
      # not-yet-uploaded artefact all land in the same place: no file, and the
      # unit floor below.
      - name: Fetch the acceptance run's profile
        id: acceptance_profile
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: acceptance-profile

      # Same reasoning as the acceptance profile above.
      - name: Fetch the container suites' profile
        id: container_profile
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-profile

      - name: Merge the profiles and enforce the floor
        run: |
          set -euo pipefail
          go run ./tools/covmerge union.out coverage.out docker.out acceptance.profile

          # Which floor applies is decided by what arrived, not by what was
          # hoped for. The union floor assumes all three profiles; anything
          # less is held to the unit floor rather than being failed for
          # missing coverage it was never going to produce.
          if [ -f acceptance.profile ] && [ -f docker.out ]; then
            echo "every profile arrived: enforcing the union floor"
            .github/scripts/coverage-floor.sh union.out "$UNION_FLOOR"
          else
            echo "a profile is missing: enforcing the unit floor"
            .github/scripts/coverage-floor.sh union.out "$UNIT_FLOOR"
          fi

      # Codecov reports the trend and annotates pull requests; the floor above
      # is what actually fails the build. Two mechanisms on purpose: a service
      # being down, rate-limited or unconfigured must not be able to let an
      # uncovered change through, and `fail_ci_if_error` is false for the same
      # reason.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./union.out
          # Go's own profile format, which Codecov parses directly -- no
          # conversion step to keep in step with the one `just` runs locally.
          disable_search: true
          fail_ci_if_error: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-profile
          path: |
            coverage.out
            union.out
          retention-days: 7

  # The one check a branch ruleset should require.
  #
  # Requiring the individual jobs does not work here: they are change-gated, and
  # a required check that never reports blocks a pull request forever rather
  # than failing it. A docs-only change legitimately skips `test`, `acceptance`
  # and the rest, and GitHub cannot tell "skipped because the filter said so"
  # from "never going to report".
  #
  # So this job always runs, and reduces every gate to one verdict.
  required:
    name: Required Continuous Integration
    # always(), so it reports even when something upstream failed -- without
    # it this job would itself be skipped, which is the failure mode it exists
    # to prevent.
    if: always()
    needs:
      - changes
      - workflows
      - quality
      - test
      - docs
      - acceptance
      - containers
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job reads the workflow file and runs no git operation, so the
          # token the default checkout leaves in .git/config would sit there
          # for the rest of the job serving nothing.
          persist-credentials: false

      # `needs` above is a hand-written list, and toJSON serialises exactly
      # that list -- so a gate added to this workflow and forgotten here would
      # be invisible to the verdict below, and this check would stay green
      # while that gate failed. A required check with a silent hole in it is
      # worse than no required check, because it is believed.
      #
      # So the list is compared against the workflow rather than trusted: every
      # job defined here, except this one, has to be wired in.
      #
      # Parsed rather than pattern-matched. A line pattern is blind to a name
      # with a capital in it, a trailing comment after the colon, or a quoted
      # key -- and every one of those *removes* a job from the comparison
      # rather than adding one, which is this check's own failure mode turned
      # on itself.
      - name: Every gate in this workflow is wired into this check
        env:
          WIRED: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # yq on the runner image, PyYAML if a future image drops it. Neither
          # is installed here on purpose: this is the check a ruleset requires,
          # and a gate that reaches out to a package index before it can answer
          # has traded a clear failure for a flaky one.
          #
          # So the reader is named and the absence of one is reported as
          # itself. A parse failure is swallowed for the same reason -- the
          # check below says which gate is unwired, or why it cannot tell,
          # rather than the run ending on a bare jq error or a traceback.
          reader=""
          if command -v yq >/dev/null 2>&1; then
            reader="yq"
            all=$(yq -r '.jobs | keys[]' .github/workflows/ci.yml 2>/dev/null || true)
          elif python3 -c 'import yaml' 2>/dev/null; then
            reader="python3+PyYAML"
            all=$(python3 -c 'import sys, yaml; print("\n".join(yaml.safe_load(open(sys.argv[1]))["jobs"]))' \
              .github/workflows/ci.yml 2>/dev/null || true)
          else
            echo "::error::no YAML reader on this runner (need yq or PyYAML) —" \
              "this check cannot confirm every gate is wired in, so it refuses"
            exit 1
          fi
          echo "job names read with ${reader}"

          # The reader has to be able to see *this* job, or it cannot be
          # trusted to see the others: a parse that returned nothing would
          # otherwise read as "nothing missing", which is the exact verdict
          # this step exists to make impossible.
          if ! printf '%s\n' "$all" | grep -qx required; then
            echo "::error::cannot read job names from .github/workflows/ci.yml"
            exit 1
          fi

          # LC_ALL=C on both, because comm compares bytes: a sort in the
          # runner's locale can order "-" and "_" differently and make comm
          # report a difference that is not there.
          defined=$(printf '%s\n' "$all" | grep -vx required | LC_ALL=C sort)
          wired=$(printf '%s' "$WIRED" | jq -r 'keys[]' | LC_ALL=C sort)

          missing=$(LC_ALL=C comm -23 <(printf '%s\n' "$defined") <(printf '%s\n' "$wired"))
          if [ -n "$missing" ]; then
            echo "::error::gates missing from the required check's needs: $(printf '%s' "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "every gate in this workflow is wired in"

      - name: Every gate passed or was legitimately skipped
        env:
          # Exactly the jobs named in `needs` above -- which the step before
          # this one has just proved is all of them.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort

          # A failed job is a failure. A *skipped* one is not: it is either
          # change-gated away, or downstream of something that already failed
          # -- and that something reports its own failure here, so nothing is
          # lost by letting the skip pass.
          bad=$(echo "$RESULTS" | jq -r '
            [to_entries[]
             | select(.value.result == "failure" or .value.result == "cancelled")
             | .key] | join(", ")')

          if [ -n "$bad" ]; then
            echo "::error::continuous integration did not pass: ${bad}"
            exit 1
          fi
          echo "every gate passed or was legitimately skipped"
