# Publish a released minor's documentation.
#
# A published release publishes `<major>.<minor>` and, when it is the newest
# released minor, moves the `latest` alias and the root redirect onto it. `dev`
# is main's in-progress docs and is handled by docs-dev.yaml; it never carries
# an alias and is never the default.
#
# Published rather than tagged. The tag starts release.yaml, which runs the full
# CI and leaves a draft for a maintainer to publish; docs deployed at the tag
# named downloads that did not exist yet, and moved the root's install.sh ahead
# of the release the nightly job compares it with (RFC 0006 decision 20). The
# release event carries its tag in GITHUB_REF_NAME, as the push did.
#
# Versioned because the manifest schema, the state schema and the manager are
# each versioned independently. A tool whose entire job is careful version
# transitions cannot document only its newest self.
name: Deploy released documentation

on:
  release:
    types: [published]
  workflow_dispatch:

# Shared with docs-dev.yaml: every deploy rewrites the gh-pages branch, and two
# racing would corrupt the version index. Never cancelled mid-push -- a
# half-finished deploy is how an alias ends up pointing at nothing.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish released docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # mike pushes the built site to gh-pages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0    # mike reads and rewrites gh-pages
          fetch-tags: true  # every tag, to find the newest released minor

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v9

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve the docs version
        id: ver
        run: .github/scripts/resolve-docs-version.sh

      - name: Publish
        env:
          MINOR: ${{ steps.ver.outputs.minor }}
          MOVE_LATEST: ${{ steps.ver.outputs.move_latest }}
        run: |
          set -euo pipefail
          if [ "$MOVE_LATEST" = "true" ]; then
            just deploy-docs "$MINOR" latest
            just default-docs latest
          else
            just deploy-docs "$MINOR"
          fi

      # After mike, and on every docs release that moves `latest`. mike owns
      # index.html and versions.json at the root; a sibling file surviving
      # that is its behaviour rather than its promise, so this re-publishes
      # rather than trusting the last one is still there. A backport tag
      # skips it: its files are older than the root's (RFC 0022 decision 18).
      # The nightly job checks the published bytes against the newest tag's.
      - name: Publish install.sh and the schemas at the site root
        if: steps.ver.outputs.move_latest == 'true'
        run: .github/scripts/publish-site-root.sh
