# Publish main's in-progress documentation to the `dev` version.
#
# `dev` never carries the `latest` alias, so this can never disturb released
# docs. It is also not the default once anything is released: docs-release.yaml
# moves the site root onto `latest` when a release ships, and the last step here
# then does nothing for the rest of the repository's life.
#
# Before the first release there is nothing for the root to point at, and mike
# writes that redirect only on `set-default`. The result was a published site
# where /morzer/dev/ served fine and /morzer/ returned 404 -- so the last step
# bootstraps the root and steps aside the moment a release owns it.
#
# The build itself is `just deploy-docs`, so the generator and its pins live in
# one place and a contributor can reproduce what CI does.
name: Deploy dev documentation

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/docs-dev.yaml'
  workflow_dispatch:

# One group shared with any future release deployment: concurrent deploys all
# mutate gh-pages, and a cancelled half-push is how the version index ends up
# pointing at nothing. Never cancel in progress.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish dev docs
    # `dev` always tracks main. The push trigger is already main-only; this also
    # pins a manual run to main, so it cannot be dispatched from a feature
    # branch and silently overwrite main's docs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # mike pushes the built site to the gh-pages branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history; mike reads and rewrites gh-pages

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v9

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # mike writes a commit to gh-pages, so it needs an author.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: just deploy-docs dev

      # Only while no release owns the root. `git cat-file -e` asks the
      # published branch itself rather than trusting a local ref, because mike
      # has just rewritten it.
      - name: Point the site root at dev until a release owns it
        run: |
          set -euo pipefail
          git fetch --quiet origin gh-pages
          if git cat-file -e FETCH_HEAD:index.html 2>/dev/null; then
            echo "the site root already points at a version; leaving it alone"
            exit 0
          fi
          echo "no site root yet, and nothing is released; pointing it at dev"
          just default-docs dev
